name: Release

# Tag pushes of the form timelord-vX.Y.Z build and publish a GitHub Release
# (versioned Windows agent zip) plus a versioned controller image on GHCR.
# workflow_dispatch lets you run every build/test step on demand (e.g. to
# sanity-check a branch) without publishing anything — the publish steps
# only run for an actual tag push.
on:
  push:
    tags:
      - "timelord-v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Cargo.toml is the source of truth for the version. A release tag must match it, so the
      # agent (which reports its Cargo.toml version), the zip and the controller image all agree.
      - id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' agent/Cargo.toml | head -n 1)"
          for crate in notifier ipc; do
            other="$(sed -n 's/^version = "\(.*\)"/\1/p' "$crate/Cargo.toml" | head -n 1)"
            if [[ "$other" != "$version" ]]; then
              echo "::error::$crate/Cargo.toml is $other but agent/Cargo.toml is $version"
              exit 1
            fi
          done
          if [[ "${GITHUB_REF}" == refs/tags/timelord-v* ]]; then
            tag_version="${GITHUB_REF_NAME#timelord-v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent
            notifier
            ipc

      - run: cargo test --locked

      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo test --locked
        working-directory: ipc

      - run: cargo test --locked
        working-directory: notifier

      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: notifier

  test-controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('controller/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # Testcontainers talks to the Docker daemon already present on
      # GitHub-hosted runners — no socket-mounting workaround needed here.
      - run: mvn -B test

  build-windows:
    needs: [test-agent, version]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent
            notifier

      - run: cargo build --release --locked

      - name: Check the agent reports the release version
        shell: pwsh
        run: |
          $reported = (& target/release/timelord-agent.exe --version).Trim()
          if ($reported -ne "timelord-agent $env:VERSION") {
            throw "agent reports '$reported', expected 'timelord-agent $env:VERSION'"
          }

      # The notifier's toast code only compiles on Windows, so its tests (and build) run here.
      - run: cargo test --locked
        working-directory: notifier

      - run: cargo build --release --locked
        working-directory: notifier

      - name: Package release zip
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target/release/timelord-agent.exe $dist/
          Copy-Item ../notifier/target/release/timelord-notifier.exe $dist/
          Copy-Item ../deployment/windows/install.ps1 $dist/
          Copy-Item ../deployment/windows/uninstall.ps1 $dist/
          Copy-Item ../deployment/windows/README.md $dist/
          Copy-Item README.md $dist/AGENT_README.md
          Compress-Archive -Path "$dist/*" -DestinationPath "timelord-agent-$env:VERSION-windows-x86_64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: timelord-agent-windows
          path: agent/timelord-agent-*-windows-x86_64.zip
          if-no-files-found: error

  build-controller-image:
    needs: [test-controller, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/timelord-controller
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On workflow_dispatch (no tag) this builds without pushing, same
      # "verify it builds, don't publish" behavior as the other jobs.
      - uses: docker/build-push-action@v7
        with:
          context: controller
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build-windows, build-controller-image, version]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: timelord-agent-windows
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/timelord-agent-*-windows-x86_64.zip
          generate_release_notes: true
          name: ${{ github.ref_name }}
          body: |
            Controller image: `ghcr.io/${{ github.repository_owner }}/timelord-controller:${{ env.VERSION }}`
