[package]
name = "timelord-ipc"
version = "0.1.65"
edition = "2021"
description = "Local IPC types shared by the TimeLord agent service and the per-user notifier"
license = "AGPL-3.0-or-later"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
