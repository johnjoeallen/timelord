<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head('Devices')}"></div>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h1 class="mb-4">Devices</h1>

    <form class="row g-2 mb-3" method="get" th:action="@{/devices}">
        <div class="col-auto">
            <input type="text" class="form-control" name="hostname" placeholder="Filter by hostname" th:value="${hostname}"/>
        </div>
        <div class="col-auto">
            <select class="form-select" name="online">
                <option value="" th:selected="${online == null}">All</option>
                <option value="true" th:selected="${online != null and online}">Online</option>
                <option value="false" th:selected="${online != null and !online}">Offline</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Filter</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Name</th>
                <th>Hostname</th>
                <th>Agent</th>
                <th>OS</th>
                <th>Status</th>
                <th>User</th>
                <th>Session</th>
                <th>Idle</th>
                <th>Last heartbeat</th>
                <th>Source IP</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="device : ${devices}">
                <td><a th:href="@{/devices/{id}(id=${device.deviceId})}" th:text="${device.deviceName}"></a></td>
                <td th:text="${device.hostname}"></td>
                <td th:text="${device.agentVersion}"></td>
                <td th:text="${device.operatingSystem}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${device.status.name() == 'ONLINE'} ? 'status-badge-online' : 'status-badge-offline'"
                          th:text="${device.status}"></span>
                </td>
                <td th:text="${device.currentUser} ?: '–'"></td>
                <td th:text="${device.sessionState} ?: '–'"></td>
                <td th:text="${device.idleSeconds} ?: '–'"></td>
                <td th:text="${device.lastHeartbeatAt} ? ${@timeFormat.format(device.lastHeartbeatAt, zone)} : 'never'"></td>
                <td th:text="${device.sourceIp}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(devices)}">
                <td colspan="10" class="text-muted text-center py-3">No devices registered yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
