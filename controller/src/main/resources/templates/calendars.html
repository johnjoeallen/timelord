<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head('Calendars')}"></div>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h1 class="mb-4">Calendars</h1>
    <div th:replace="~{fragments/flash :: flash}"></div>

    <div class="row g-3 mb-4">
        <div class="col-md-6 col-lg-4" th:each="c : ${calendars}">
            <a class="text-decoration-none text-body" th:href="@{/calendars/{id}(id=${c.id})}">
                <div class="card device-card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div class="fw-semibold" th:text="${c.name}"></div>
                            <span class="badge text-bg-secondary" th:text="${c.action.name() == 'SLEEP'} ? 'Sleep' : 'Shutdown'"></span>
                        </div>
                        <div class="text-muted small" th:text="${c.timezone}"></div>
                        <div class="small mt-2">
                            <span th:text="${#lists.size(c.rules)} + ' weekly row(s)'"></span>,
                            <span th:text="${#lists.size(c.overrides)} + ' override(s)'"></span>
                        </div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(calendars)}">
            <p class="text-muted text-center py-3">No calendars yet. Create one below, then assign it to a device.</p>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">New calendar</div>
        <div class="card-body">
            <form method="post" th:action="@{/calendars}" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="name">Name</label>
                    <input class="form-control" id="name" name="name" required maxlength="200" placeholder="School kids"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="timezone">Timezone</label>
                    <input class="form-control" id="timezone" name="timezone" list="tzlist" required th:value="${defaultZone}"/>
                    <datalist id="tzlist"><option th:each="z : ${timezones}" th:value="${z}"></option></datalist>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="action">At off time</label>
                    <select class="form-select" id="action" name="action">
                        <option value="SLEEP">Sleep the device</option>
                        <option value="SHUTDOWN">Shut the device down</option>
                    </select>
                </div>
                <div class="col-12"><button class="btn btn-primary" type="submit">Create</button></div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
