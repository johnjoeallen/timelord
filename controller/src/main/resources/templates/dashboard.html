<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head('Dashboard')}"></div>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h1 class="mb-4">Dashboard</h1>
    <div th:replace="~{fragments/flash :: flash}"></div>

    <div class="card mb-4">
        <div class="card-header">Message all devices</div>
        <div class="card-body">
            <form method="post" th:action="@{/messages}" class="row g-2 align-items-end">
                <div class="col-md-3"><label class="form-label" for="atitle">Title (optional)</label>
                    <input class="form-control" id="atitle" name="title" maxlength="100" placeholder="TimeLord"/></div>
                <div class="col-md-5"><label class="form-label" for="abody">Message</label>
                    <input class="form-control" id="abody" name="body" maxlength="500" required placeholder="Homework time, please wrap up"/></div>
                <div class="col-6 col-md-2"><label class="form-label" for="aexp">Show for</label>
                    <select class="form-select" id="aexp" name="expiresInMinutes">
                        <option value="15">15 minutes</option>
                        <option value="60">1 hour</option>
                        <option value="240" selected>4 hours</option>
                        <option value="1440">24 hours</option>
                    </select></div>
                <div class="col-6 col-md-2"><button class="btn btn-primary w-100" type="submit">Send</button></div>
            </form>
        </div>
    </div>

    <h2 class="h4 mb-3">Devices</h2>
    <div class="row g-3 mb-4">
        <div class="col-md-6 col-lg-4" th:each="device : ${devices}">
            <a class="text-decoration-none text-body" th:href="@{/devices/{id}(id=${device.deviceId})}">
                <div class="card device-card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div class="fw-semibold" th:text="${device.deviceName}"></div>
                            <div th:switch="${device.displayStatus}">
                                <span th:case="'OFFLINE'" class="badge status-badge-offline">Offline</span>
                                <span th:case="'ACTIVE'" class="badge status-badge-active">Active</span>
                                <span th:case="'LOCKED'" class="badge session-state-locked">Locked</span>
                                <span th:case="'SUSPENDED'" class="badge session-badge-suspended">Suspended</span>
                                <span th:case="'DISCONNECTED'" class="badge session-badge-disappeared">Disconnected</span>
                                <span th:case="*" class="badge status-badge-inactive">Inactive</span>
                            </div>
                        </div>
                        <div class="text-muted small mb-2" th:text="${device.hostname}"></div>
                        <div class="small">
                            <span class="uptime-dot"
                                  th:classappend="${device.status.name() == 'ONLINE'} ? 'uptime-dot-online' : 'uptime-dot-offline'"></span>
                            <span th:if="${device.status.name() == 'ONLINE'}" th:text="${device.currentUser} ?: 'no user session'"></span>
                            <span th:if="${device.status.name() != 'ONLINE'}"
                                  th:text="${device.lastHeartbeatAt} ? ('last seen ' + ${@timeFormat.format(device.lastHeartbeatAt, zone)}) : 'never seen'"></span>
                        </div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(devices)}">
            <p class="text-muted text-center py-3">No devices registered yet.</p>
        </div>
    </div>
</div>
<div th:replace="~{fragments/live-refresh :: live-refresh}"></div>
</body>
</html>
