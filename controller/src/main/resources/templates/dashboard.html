<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head('Dashboard')}"></div>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h1 class="mb-4">Dashboard</h1>

    <h2 class="h4 mb-3">Devices</h2>
    <div class="row g-3 mb-4">
        <div class="col-md-6 col-lg-4" th:each="device : ${devices}">
            <a class="text-decoration-none text-body" th:href="@{/devices/{id}(id=${device.deviceId})}">
                <div class="card device-card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div class="fw-semibold" th:text="${device.deviceName}"></div>
                            <span class="badge"
                                  th:classappend="${device.status.name() == 'ONLINE'} ? 'status-badge-online' : 'status-badge-offline'"
                                  th:text="${device.status}"></span>
                        </div>
                        <div class="text-muted small mb-2" th:text="${device.hostname}"></div>
                        <div class="small">
                            <span class="uptime-dot"
                                  th:classappend="${device.status.name() == 'ONLINE'} ? 'uptime-dot-online' : 'uptime-dot-offline'"></span>
                            <span th:if="${device.status.name() == 'ONLINE'}" th:text="${device.currentUser} ?: 'no user session'"></span>
                            <span th:if="${device.status.name() != 'ONLINE'}"
                                  th:text="${device.lastHeartbeatAt} ? ('last seen ' + ${#temporals.format(device.lastHeartbeatAt, 'MMM d, HH:mm')}) : 'never seen'"></span>
                        </div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(devices)}">
            <p class="text-muted text-center py-3">No devices registered yet.</p>
        </div>
    </div>

    <h2 class="h4 mb-3">Recent sessions</h2>
    <p class="text-muted small">
        A session runs from when a device starts up until it either shuts down cleanly or stops sending heartbeats.
    </p>
    <div class="table-responsive">
        <table class="table table-sm table-hover">
            <thead>
            <tr>
                <th>Device</th>
                <th>Start</th>
                <th class="d-none d-sm-table-cell">End</th>
                <th>Duration</th>
                <th>Ended by</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${recentSessions}">
                <td><a th:href="@{/devices/{id}(id=${s.deviceId})}" th:text="${s.deviceName}"></a></td>
                <td th:text="${#temporals.format(s.start, 'MMM d, HH:mm')}"></td>
                <td class="d-none d-sm-table-cell" th:text="${s.end} ? ${#temporals.format(s.end, 'MMM d, HH:mm')} : 'ongoing'"></td>
                <td th:text="${s.durationLabel()}"></td>
                <td>
                    <span th:if="${s.ongoing}" class="badge session-badge-ongoing">Ongoing</span>
                    <span th:if="${!s.ongoing and s.endReason != null and s.endReason.name() == 'STOPPED'}"
                          class="badge session-badge-stopped">Stopped</span>
                    <span th:if="${!s.ongoing and s.endReason != null and s.endReason.name() == 'SUSPENDED'}"
                          class="badge session-badge-suspended">Suspended</span>
                    <span th:if="${!s.ongoing and s.endReason != null and s.endReason.name() == 'DISAPPEARED'}"
                          class="badge session-badge-disappeared">Disappeared</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(recentSessions)}">
                <td colspan="5" class="text-muted text-center py-3">No sessions yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script>
    // Keeps the device/session view current without the operator having to
    // reload by hand. The server pushes a message over /ws/devices every
    // time a device sends a heartbeat, registers, or the controller decides
    // a device has gone offline (DeviceService broadcasts on all three) —
    // any message is treated as "something changed, look again" rather than
    // carrying the full state itself. A 60s timer is kept as a fallback in
    // case the socket is down (also covers things a status change alone
    // wouldn't, like an ongoing session's duration ticking up).
    (function () {
        var FULL_REFRESH_MS = 60000;
        var RECONNECT_DELAY_MS = 3000;
        var RELOAD_DEBOUNCE_MS = 500;
        var reloadTimer = null;

        function scheduleReload() {
            if (reloadTimer) {
                return;
            }
            reloadTimer = setTimeout(function () { location.reload(); }, RELOAD_DEBOUNCE_MS);
        }

        function connect() {
            var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            var socket = new WebSocket(protocol + '//' + location.host + '/ws/devices');
            socket.onmessage = scheduleReload;
            socket.onclose = function () { setTimeout(connect, RECONNECT_DELAY_MS); };
            socket.onerror = function () { socket.close(); };
        }

        connect();
        setInterval(function () { location.reload(); }, FULL_REFRESH_MS);
    })();
</script>
</body>
</html>
